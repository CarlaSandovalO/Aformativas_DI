<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CI1-5-brief</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#ffffff;
  font-family:Poppins, Arial, sans-serif;
  color:#0B2B3D;
}

.wrap{
  max-width:1000px;
  margin:0 auto;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:0 0 5px 0;
}

.tab{
  border:1.5px solid #C6DCE1;
  border-radius:8px;
  background:#F8FCFD;
  color:#0B2B3D;
  padding:8px 6px;
  min-height:40px;
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.tab:hover{
  border-color:#00B3C7;
}

.tab.active{
  background:#00B3C7;
  border-color:#00B3C7;
  color:#ffffff;
}

.detail{
  margin:0;
  padding:5px 10px 2px;
  font-size:15px;
  line-height:1.35;
  color:#526B76;
}

.detail strong{
  color:#0B2B3D;
}

@media(max-width:650px){

  .tabs{
    grid-template-columns:repeat(2,1fr);
  }

  .tab{
    font-size:14px;
  }

}

</style>
</head>

<body>

<div class="wrap">

  <div class="tabs">

    <button class="tab active" type="button" onclick="showInfo('necesidad',this)">
      Necesidad
    </button>

    <button class="tab" type="button" onclick="showInfo('evidencia',this)">
      Evidencia
    </button>

    <button class="tab" type="button" onclick="showInfo('vacios',this)">
      Vacíos
    </button>

    <button class="tab" type="button" onclick="showInfo('decisiones',this)">
      Decisiones
    </button>

  </div>


  <div class="detail" id="detail">
    <strong>Necesidad:</strong> ¿Está claro qué problema, necesidad o situación origina el proyecto?
  </div>

</div>


<script>

const content = {

  necesidad:
  "<strong>Necesidad:</strong> ¿Está claro qué problema, necesidad o situación origina el proyecto?",

  evidencia:
  "<strong>Evidencia:</strong> ¿Qué datos, documentos, registros o testimonios respaldan lo que se afirma?",

  vacios:
  "<strong>Vacíos:</strong> ¿Qué información todavía falta o requiere validación?",

  decisiones:
  "<strong>Decisiones:</strong> ¿Qué elementos ya pueden utilizarse como base para avanzar y cuáles todavía no?"

};


function showInfo(key,button){

  document.querySelectorAll(".tab").forEach(function(tab){
    tab.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("detail").innerHTML =
    content[key];

}

</script>

</body>
</html>
