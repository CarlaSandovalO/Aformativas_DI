<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CI1-3-certeza</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#ffffff;
  font-family:Poppins, Arial, sans-serif;
  color:#0B2B3D;
}

.wrap{
  max-width:1000px;
  margin:0 auto;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:0 0 5px 0;
}

.tab{
  border:1.5px solid #C6DCE1;
  border-radius:8px;
  background:#F8FCFD;
  color:#0B2B3D;
  padding:8px 6px;
  min-height:40px;
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s ease;
}

.tab:hover{
  border-color:#00B3C7;
}

.tab.active{
  background:#00B3C7;
  border-color:#00B3C7;
  color:#ffffff;
}

.detail{
  margin:0;
  padding:5px 10px 2px;
  font-size:15px;
  line-height:1.35;
  color:#526B76;
}

.detail strong{
  color:#0B2B3D;
}

@media(max-width:650px){

  .tabs{
    grid-template-columns:repeat(2,1fr);
  }

  .tab{
    font-size:14px;
  }

}

</style>
</head>

<body>

<div class="wrap">

  <div class="tabs">

    <button class="tab active" type="button" onclick="showInfo('se',this)">
      Sé
    </button>

    <button class="tab" type="button" onclick="showInfo('infiero',this)">
      Infiero
    </button>

    <button class="tab" type="button" onclick="showInfo('supongo',this)">
      Supongo
    </button>

    <button class="tab" type="button" onclick="showInfo('investigar',this)">
      Necesito investigar
    </button>

  </div>

  <div class="detail" id="detail">
    <strong>Sé:</strong> Tengo evidencia, datos o información disponible que respalda este dato.
  </div>

</div>


<script>

const content = {

  se:
  "<strong>Sé:</strong> Tengo evidencia, datos o información disponible que respalda este dato.",

  infiero:
  "<strong>Infiero:</strong> Lo interpreto a partir de la evidencia disponible.",

  supongo:
  "<strong>Supongo:</strong> Lo estoy dando por cierto, pero todavía no cuento con evidencia suficiente.",

  investigar:
  "<strong>Necesito investigar:</strong> Debo recopilar o validar esta información antes de utilizarla para tomar una decisión."

};


function showInfo(key,button){

  document.querySelectorAll(".tab").forEach(function(tab){
    tab.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("detail").innerHTML =
    content[key];

}

</script>

</body>
</html>
