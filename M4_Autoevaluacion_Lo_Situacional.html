<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 4 · Autoevaluación Lo situacional</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F7F9FC;font-family:'Montserrat',Arial,Helvetica,sans-serif;color:#081019}
body{padding:8px}
.app{max-width:980px;height:464px;margin:0 auto;background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.top{padding:12px 18px 9px;border-bottom:1px solid #E5E7EB;background:#fff}
.kicker{font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#D08E2F;margin-bottom:3px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:22px;line-height:1.15;margin:0;color:#152c4a}
.step-label{font-size:12px;color:#667085;white-space:nowrap}
.progress{height:5px;background:#EDF1F5;border-radius:99px;margin-top:9px;overflow:hidden}
.progress span{display:block;height:100%;background:#D08E2F;width:0;transition:.2s}
.stage{flex:1;min-height:0;padding:14px 18px 10px;display:flex;align-items:stretch}
.card{width:100%;border:1px solid #E1E3E6;border-radius:10px;padding:16px 18px;background:#FCFCFD;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.intro-card{text-align:center;align-items:center}
.intro-card h2{font-size:20px;color:#152c4a;margin:0 0 8px}
.intro-card p{max-width:760px;margin:0 auto 10px;font-size:14px;line-height:1.48;color:#475467}
.notice{max-width:760px;background:#F7F9FC;border-left:4px solid #D08E2F;border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.42;color:#475467;text-align:left}
.scale-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:760px;margin-top:10px}
.scale-mini div{border:1px solid #E1E3E6;border-radius:7px;padding:6px 4px;font-size:10.5px;color:#667085}.scale-mini strong{display:block;color:#152c4a;font-size:13px}
.section-tag{font-size:12px;font-weight:700;color:#D08E2F;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.question{font-size:17px;line-height:1.4;color:#152c4a;font-weight:700;margin:0 0 15px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.likert label{cursor:pointer;border:1px solid #D0D5DD;border-radius:8px;padding:10px 5px;text-align:center;font-size:13px;background:#fff;color:#344054;transition:.15s}
.likert input{position:absolute;opacity:0;pointer-events:none}
.likert label:has(input:checked){background:#FFF7EA;border-color:#D08E2F;color:#7A4A06;font-weight:700}
.reflection-label{font-size:17px;line-height:1.35;color:#152c4a;font-weight:700;margin:0 0 10px}
textarea{width:100%;height:120px;resize:none;border:1px solid #D0D5DD;border-radius:8px;padding:10px 12px;font:13.5px/1.45 'Montserrat',Arial,sans-serif;color:#344054;background:#fff}
.result-card{justify-content:flex-start}
.result-card h2{font-size:19px;color:#152c4a;margin:0 0 4px;text-align:center}
.result-intro{font-size:12px;color:#667085;text-align:center;margin:0 0 9px}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.result-item{border:1px solid #E1E3E6;border-radius:8px;padding:9px 10px;background:#fff}
.result-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700}.score{color:#D08E2F}
.bar{height:6px;background:#EDF1F5;border-radius:99px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;background:#D08E2F}
.guidance{margin-top:8px;background:#F7F9FC;border-left:4px solid #D08E2F;border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.38;color:#475467}
.nav{height:58px;flex:0 0 58px;border-top:1px solid #E5E7EB;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff}
.nav-left,.nav-right{display:flex;gap:8px}
.btn{border:0;border-radius:8px;padding:9px 14px;font:700 12.5px 'Montserrat',Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:#152c4a;color:#fff}
.btn.gold{background:#D08E2F;color:#fff}
.btn.secondary{background:#F2F4F7;color:#344054;border:1px solid #D0D5DD}
.btn:disabled{opacity:.42;cursor:not-allowed}
.warning{font-size:11.5px;color:#B54708;margin-top:8px;display:none}
.print-footer{display:none}
@media(max-width:650px){
 body{padding:4px}.app{height:472px}.top{padding:10px 12px 8px}h1{font-size:18px}.step-label{font-size:10px}
 .stage{padding:10px 10px 8px}.card{padding:13px 12px}.question,.reflection-label{font-size:15px}
 .likert{gap:4px}.likert label{padding:9px 2px;font-size:12px}
 .nav{padding:8px 10px}.btn{padding:8px 9px;font-size:11.5px}
 .result-grid{grid-template-columns:1fr 1fr}
}
@media print{
 html,body{background:#fff}.app{height:auto;border:0;overflow:visible}.top,.nav{display:none!important}.stage{display:block;padding:0}.card{display:none!important}
 .print-sheet{display:block!important;padding:22px 28px 55px}.print-sheet h1{font-size:22px;margin-bottom:12px}
 .print-sheet h2{font-size:16px;color:#152c4a;margin:16px 0 6px}.print-sheet p{font-size:11.5px;line-height:1.4;margin:4px 0}
 .print-footer{display:block;position:fixed;left:0;right:0;bottom:0;border-top:1px solid #D0D5DD;padding:8px 18px;text-align:center;font-size:9.5px;color:#667085;background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="kicker">Actividad formativa · Módulo 4</div>
    <div class="title-row">
      <h1>Autoevaluación del negociador: Lo situacional</h1>
      <div class="step-label" id="stepLabel"></div>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
  </div>

  <main class="stage" id="stage"></main>

  <div class="nav">
    <div class="nav-left">
      <button class="btn secondary" id="prevBtn">Anterior</button>
    </div>
    <div class="nav-right">
      <button class="btn secondary" id="excelBtn" style="display:none">Descargar Excel</button>
      <button class="btn secondary" id="pdfBtn" style="display:none">Guardar PDF</button>
      <button class="btn gold" id="nextBtn">Comenzar</button>
    </div>
  </div>
</div>

<div class="print-sheet" id="printSheet" style="display:none"></div>
<div class="print-footer">Material elaborado por Rybs Ideas, para la Certificación en Modelo Estratégico de Negociación</div>

<script>
const sections=[
 {key:'personas',title:'Personas',subtitle:'Comprensión del Opuesto Complemento (OC)',items:[
  'Antes de negociar, dedico tiempo a analizar quién es mi Opuesto Complemento.',
  'Considero los posibles intereses, necesidades, actitudes y valores del OC, no solo sus demandas.',
  'Soy consciente de que puedo enfrentar un OCD y adapto mi estrategia a ello.',
  'Observo señales verbales y no verbales para comprender mejor al OC.',
  'Evito asumir que el OC piensa o decide como yo.'
 ],reflection:'¿Qué tan preparado(a) llegas normalmente a la mesa respecto a las personas con las que negocias?'},
 {key:'contexto',title:'Contexto',subtitle:'Lectura del entorno negociador',items:[
  'Analizo el contexto cultural y relacional antes de negociar.',
  'Reconozco cómo la historia previa entre los negociadores influye.',
  'Ajusto mi forma de comunicarme según el contexto y no solo según mi preferencia personal.',
  'Soy consciente de las presiones externas (tiempo, poder, jerarquía) que influyen en la negociación.',
  'Evito negociar como si todas las situaciones fueran iguales.'
 ],reflection:'¿Qué elementos del contexto sueles subestimar cuando negocias?'},
 {key:'posibilidades',title:'Posibilidades',subtitle:'Evaluación realista de la negociación',items:[
  'Evalúo si existen condiciones reales para negociar antes de sentarme a la mesa.',
  'Tengo claridad sobre mi Nivel Básico de Negociación (NBN).',
  'Reconozco cuándo una situación no es negociable sino impositiva.',
  'Sé identificar el momento adecuado para retirarme sin arrepentimientos.',
  'Prefiero no negociar antes que aceptar acuerdos que vulneren mis valores.'
 ],reflection:'¿Qué te cuesta más: iniciar una negociación o decidir retirarte?'},
 {key:'integracion',title:'Integración situacional',subtitle:'Síntesis',items:[
  'Integro personas, contexto y posibilidades antes de definir mi estrategia.',
  'Siento que este capítulo me ayuda a negociar con mayor conciencia y realismo.'
 ],reflection:'Elabora una conclusión sobre el capítulo y los ajustes que incorporarás para la siguiente negociación.'}
];

const steps=[{type:'intro'}];
sections.forEach(sec=>{
 sec.items.forEach((q,i)=>steps.push({type:'question',sec,index:i}));
 steps.push({type:'reflection',sec});
});
steps.push({type:'results'});

let current=0;
const answers={};
const reflections={};
const stage=document.getElementById('stage');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const excelBtn=document.getElementById('excelBtn');
const pdfBtn=document.getElementById('pdfBtn');
const stepLabel=document.getElementById('stepLabel');
const progressBar=document.getElementById('progressBar');

function render(){
 const step=steps[current];
 const pct=(current/(steps.length-1))*100;
 progressBar.style.width=pct+'%';
 stepLabel.textContent=current===0?'Inicio':current===steps.length-1?'Resultados':`${current} de ${steps.length-2}`;
 prevBtn.disabled=current===0;
 excelBtn.style.display=step.type==='results'?'inline-flex':'none';
 pdfBtn.style.display=step.type==='results'?'inline-flex':'none';
 nextBtn.style.display=step.type==='results'?'none':'inline-flex';
 nextBtn.textContent=current===0?'Comenzar':current===steps.length-2?'Ver resultados':'Siguiente';

 if(step.type==='intro'){
   stage.innerHTML=`<section class="card intro-card">
     <h2>Observa tu forma de analizar una negociación</h2>
     <p>Responde pensando en una negociación real reciente o próxima. Esta actividad no busca asignarte una calificación, sino ayudarte a reconocer cómo analizas a las personas, el contexto y las posibilidades antes de negociar.</p>
     <div class="notice">Selecciona una respuesta en cada afirmación. Al finalizar recibirás un resultado descriptivo por dimensión. Tus respuestas se procesan únicamente en este navegador.</div>
     <div class="scale-mini">
       <div><strong>1</strong>Totalmente en desacuerdo</div><div><strong>2</strong>En desacuerdo</div><div><strong>3</strong>Ni de acuerdo ni en desacuerdo</div><div><strong>4</strong>De acuerdo</div><div><strong>5</strong>Totalmente de acuerdo</div>
     </div>
   </section>`;
   return;
 }
 if(step.type==='question'){
   const sec=step.sec, name=`${sec.key}_${step.index+1}`, val=answers[name]||'';
   stage.innerHTML=`<section class="card">
     <div class="section-tag">${sec.title} · ${sec.subtitle}</div>
     <div class="question">${step.index+1}. ${sec.items[step.index]}</div>
     <div class="likert">
       ${[1,2,3,4,5].map(v=>`<label><input type="radio" name="q" value="${v}" ${String(v)===String(val)?'checked':''}>${v}</label>`).join('')}
     </div>
     <div class="warning" id="warn">Selecciona una respuesta para continuar.</div>
   </section>`;
   stage.querySelectorAll('input[name="q"]').forEach(el=>el.addEventListener('change',()=>{answers[name]=Number(el.value);document.getElementById('warn').style.display='none';}));
   return;
 }
 if(step.type==='reflection'){
   const sec=step.sec;
   stage.innerHTML=`<section class="card">
     <div class="section-tag">${sec.title} · Reflexión</div>
     <div class="reflection-label">${sec.reflection}</div>
     <textarea id="reflection" placeholder="Escribe aquí tu reflexión...">${reflections[sec.key]||''}</textarea>
   </section>`;
   const t=document.getElementById('reflection');
   t.addEventListener('input',()=>reflections[sec.key]=t.value);
   return;
 }
 renderResults();
}

function canAdvance(){
 const step=steps[current];
 if(step.type!=='question') return true;
 const name=`${step.sec.key}_${step.index+1}`;
 if(!answers[name]){document.getElementById('warn').style.display='block';return false}
 return true;
}

function getScores(){
 const scores={}; let total=0,count=0;
 sections.forEach(sec=>{
   let sum=0,n=0;
   sec.items.forEach((_,i)=>{const v=answers[`${sec.key}_${i+1}`]; if(v){sum+=v;n++;total+=v;count++;}});
   scores[sec.key]={name:sec.title,avg:n?sum/n:0};
 });
 return {scores,overall:count?total/count:0};
}

function renderResults(){
 const {scores,overall}=getScores();
 let lowest=null;
 Object.entries(scores).forEach(([key,d])=>{if(!lowest||d.avg<lowest.avg)lowest={key,...d}});
 stage.innerHTML=`<section class="card result-card">
   <h2>Tu autoevaluación situacional</h2>
   <p class="result-intro">Los promedios muestran cómo valoraste tu práctica actual. No corresponden a un diagnóstico ni a un nivel de competencia.</p>
   <div class="result-grid">
     ${Object.values(scores).map(d=>`<div class="result-item"><div class="result-top"><span>${d.name}</span><span class="score">${d.avg.toFixed(1)} / 5</span></div><div class="bar"><span style="width:${d.avg/5*100}%"></span></div></div>`).join('')}
   </div>
   <div class="guidance">Promedio general: <strong>${overall.toFixed(1)} / 5</strong>. La dimensión con el promedio más bajo es <strong>${lowest.name}</strong>. Úsala como punto de partida para revisar qué prácticas deseas fortalecer y retoma también tus respuestas abiertas.</div>
 </section>`;
 buildPrintSheet(scores,overall,lowest);
}

function buildPrintSheet(scores,overall,lowest){
 let html=`<h1>Autoevaluación del negociador: Lo situacional</h1><p><strong>Módulo 4 · Actividad formativa</strong></p>`;
 sections.forEach(sec=>{
   html+=`<h2>${sec.title}</h2>`;
   sec.items.forEach((q,i)=>html+=`<p>${i+1}. ${q}<br><strong>Respuesta:</strong> ${answers[`${sec.key}_${i+1}`]||'Sin respuesta'} / 5</p>`);
   html+=`<p><strong>Reflexión:</strong> ${escapeHtml(reflections[sec.key]||'Sin respuesta')}</p>`;
 });
 html+=`<h2>Resultados</h2>`;
 Object.values(scores).forEach(d=>html+=`<p><strong>${d.name}:</strong> ${d.avg.toFixed(1)} / 5</p>`);
 html+=`<p><strong>Promedio general:</strong> ${overall.toFixed(1)} / 5</p><p>Dimensión con menor promedio: <strong>${lowest.name}</strong>.</p>`;
 document.getElementById('printSheet').innerHTML=html;
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function downloadExcel(){
 if(typeof XLSX==='undefined'){alert('No fue posible cargar el generador de Excel. Verifica tu conexión e inténtalo nuevamente.');return}
 const rows=[
  ['Módulo','4 - Lo situacional'],
  ['Actividad','Autoevaluación del negociador'],
  [],
  ['Dimensión','N.º','Afirmación','Respuesta (1-5)']
 ];
 sections.forEach(sec=>{
   sec.items.forEach((q,i)=>rows.push([sec.title,i+1,q,answers[`${sec.key}_${i+1}`]||'']));
   rows.push([sec.title,'','Reflexión',reflections[sec.key]||'']);
 });
 const {scores,overall}=getScores();
 rows.push([],['RESULTADOS']);
 Object.values(scores).forEach(d=>rows.push([d.name,'','','Promedio: '+d.avg.toFixed(1)]));
 rows.push(['Promedio general','','',overall.toFixed(1)]);
 rows.push([]);
 rows.push(['Material elaborado por Rybs Ideas, para la Certificación en Modelo Estratégico de Negociación']);
 const ws=XLSX.utils.aoa_to_sheet(rows);
 ws['!cols']=[{wch:23},{wch:8},{wch:95},{wch:20}];
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Autoevaluación');
 XLSX.writeFile(wb,'M4_Autoevaluacion_Lo_Situacional.xlsx');
}

prevBtn.addEventListener('click',()=>{if(current>0){current--;render()}});
nextBtn.addEventListener('click',()=>{if(canAdvance()&&current<steps.length-1){current++;render()}});
excelBtn.addEventListener('click',downloadExcel);
pdfBtn.addEventListener('click',()=>window.print());
render();
</script>
</body>
</html>
